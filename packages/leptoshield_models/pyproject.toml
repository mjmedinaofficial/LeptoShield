[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leptoshield-models"
version = "0.1.0"
description = "Canonical framework-independent SQLAlchemy 2.0 models for LeptoShield"
authors = [{ name = "LeptoShield Architecture Team" }]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["leptoshield_models*"]

